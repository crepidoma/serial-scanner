<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      外部と通信できないよう制限する。読み取りに使うファイルもすべてこのサイトから読み込む。
      wasm-unsafe-eval は文字認識（WebAssembly）の実行に必要。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; worker-src 'self' blob:; form-action 'none'; base-uri 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="シリアルナンバーの紙を撮影して、応募先ごとにまとめるアプリ。写真もシリアルも端末の外へ送りません。" />
    <meta name="theme-color" content="#1d5e57" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="シリアルスキャナー" />
    <title>シリアルスキャナー</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/client/main.tsx"></script>
  </body>
</html>
